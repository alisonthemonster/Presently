version: 2.1

parameters:
  promote_from_track:
    type: string
    default: "internal"
  promote_to_track:
    type: string
    default: "production"
  promote_release_status:
    type: string
    default: "completed"
  promote_user_fraction:
    type: string
    default: ""

jobs:
  promote_release:
    machine:
      image: android:2025.10.1
    resource_class: large
    steps:
      - checkout
      - run:
          name: Materialize Play publishing credentials
          command: |
            mkdir -p release-secrets

            play_service_account_b64="${GOOGLE_PLAY_SERVICE_ACCOUNT_B64:-${GCLOUD_SERVICE_KEY:-}}"
            if [ -z "$play_service_account_b64" ]; then
              echo "GOOGLE_PLAY_SERVICE_ACCOUNT_B64 or GCLOUD_SERVICE_KEY is required for Play promotions" >&2
              exit 1
            fi

            play_service_account_file="/home/circleci/project/release-secrets/play-service-account.json"
            echo "$play_service_account_b64" | base64 -di > "$play_service_account_file"

            printf '%s\n' \
              "PLAY_SERVICE_ACCOUNT_FILE=${play_service_account_file}" \
              > release-secrets/release.properties
      - run:
          name: Promote release in Google Play
          command: |
            cmd=(./scripts/promote_release.sh \
              --from-track "<< pipeline.parameters.promote_from_track >>" \
              --to-track "<< pipeline.parameters.promote_to_track >>" \
              --release-status "<< pipeline.parameters.promote_release_status >>")

            if [ -n "<< pipeline.parameters.promote_user_fraction >>" ]; then
              cmd+=(--user-fraction "<< pipeline.parameters.promote_user_fraction >>")
            fi

            "${cmd[@]}"

workflows:
  version: 2
  promote_release:
    jobs:
      - promote_release:
          context:
            - presently-release
