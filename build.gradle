buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.google.android.gms:oss-licenses-plugin:0.10.10'
    }
}

plugins {
    id 'com.android.application' version '8.8.2' apply false
    id 'com.android.library' version '8.8.2' apply false
    id 'org.jetbrains.kotlin.android' version '2.1.20' apply false
    id 'org.jetbrains.kotlin.kapt' version '2.1.20' apply false
    id 'org.jetbrains.kotlin.plugin.parcelize' version '2.1.20' apply false
    id 'com.google.dagger.hilt.android' version '2.57.2' apply false
    id 'com.google.gms.google-services' version '4.4.4' apply false
    id 'com.google.firebase.crashlytics' version '3.0.6' apply false
    id 'io.screenshotbot.screenshot-tests-for-android' version '0.18.0' apply false
    id 'com.osacky.fulladle' version '0.19.0' apply false
}

if (project.hasProperty("enableFladle")) {
    apply plugin: 'com.osacky.fulladle'

    fladle {
        serviceAccountCredentials = project.file("gcloud-service-key.json")
        projectId = "gratitude-journal-app"

        flankVersion = "23.10.1"

        directoriesToPull = [
                "/sdcard"
        ]

        filesToDownload = [
                "JUnitReport.xml",
                ".*/coverage/.*",
                ".*/sdcard/[^/]+\\.ec\$"
        ]

        environmentVariables = [
                coverage : "true",
                coverageFile: "/sdcard/coverage.ec"
        ]

        devices = [
                [ "model": "walleye", "version": "27", "locale": "en_US", "orientation": "portrait" ],
        ]
    }
}

apply from: 'gradle/jacoco_ci.gradle'
apply from: 'gradle/common.gradle'

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
