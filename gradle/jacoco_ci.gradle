/**
 * Presently now builds as a single app module, so no subprojects are excluded from coverage.
 */
final ignoredByJacoco = []

def setReportEnabled = { report, value ->
    if (report.hasProperty('required')) {
        report.required.set(value)
    } else {
        report.enabled = value
    }
}

def setReportOutput = { report, value ->
    if (report.hasProperty('outputLocation')) {
        report.outputLocation.set(value)
    } else {
        report.destination = value
    }
}

/**
 *  Apply additional build steps to sub-projects
 */
subprojects { prj ->

    // Apply Jacoco only if the project is not in the ignore list
    if (!ignoredByJacoco.contains(prj.name)) {

        apply plugin: 'jacoco'

        jacoco {
            toolVersion = "0.8.11"
        }

        tasks.withType(Test) {
            jacoco.includeNoLocationClasses = true
            jacoco.excludes = ['jdk.internal.*']
        }

        task jacocoReport(type: JacocoReport) {
            group = 'Reporting'
            description = 'Generate Jacoco coverage'

            reports {
                setReportEnabled(csv, true)
                setReportEnabled(xml, false)
                setReportEnabled(html, true)
            }

            // Excluded files
            def fileFilter = ['**/R.class',
                              '**/R$*.class',
                              '**/*BR*.*',
                              '**/BuildConfig.*',
                              '**/Manifest*.*',
                              '**/*Test*.*',
                              'android/**/*.*',
                              '**/ui/settings/*.*',
                              '**/model/*.*',
                              '**/room/*.*',
                              '**/di/*.*',
                              '**/dropbox/*.*',
                              '**/*Module*.*',
                              '**/reminders/*.*',
                              '**/backups/Dropbox/*.*',
                              '**/backups/UploadToCloudWorker*',
                              '**/*Binding*.*',
                              '**/*Dagger*.*',
                              '**/*Hilt*.*',
                              '**/*_journal_gratitude_com_gratitudejournal_*.*',
                              '**/*_MembersInjector.class',
                              '**/Dagger*Component.class', // covers component implementations
                              '**/Dagger*Component$Builder.class', // covers component builders
                              '**/*_Factory.class',
                              '**/*_Factory.java',
                              '**/*FirebaseCrashReporter_Factory.java',
                              '**/*_com_presently_*.*',
                              '**/hilt/*.*',
                              '**/*hilt_aggregated_deps*.*',
                              '**/DataBinderMapperImpl*.*',
                              '**/ContainerActivity*',
                              '**/AppLockFragment*',
                              '**/LocaleHelper*',
                              '**/TimelineFragment*',
                              '**/FirebaseAnalytics.kt', //not going to test 3rd party code
                              '**/calendar/*.*',]

            final kotlinTree = fileTree(dir: "${prj.buildDir}/tmp/kotlin-classes/debug", excludes: fileFilter)
            final javacTree = fileTree(dir: "${prj.buildDir}/intermediates/javac/debug", excludes: fileFilter)
            final asmTree = fileTree(dir: "${prj.buildDir}/intermediates/classes/debug/transformDebugClassesWithAsm/dirs", excludes: fileFilter)
            final mainSrc = "${prj.projectDir}/src/main/java"
            final hasAndroidTests = new File(prj.projectDir, "src/androidTest").exists()

            def selectedClassDirectories = [kotlinTree, javacTree]
            if (!asmTree.isEmpty()) {
                selectedClassDirectories = [asmTree]
            }

            def executionDataIncludes = [
                    'jacoco/testDebugUnitTest.exec',
                    'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec'
            ]
            if (hasAndroidTests) {
                executionDataIncludes.add('outputs/code-coverage/connected/*coverage.ec')
                executionDataIncludes.add('outputs/code_coverage/debugAndroidTest/connected/**/*.ec')
            }

            sourceDirectories.setFrom files([mainSrc])
            classDirectories.setFrom files(selectedClassDirectories)
            executionData.setFrom fileTree(dir: prj.buildDir, includes: executionDataIncludes)
        }
    }
}

apply plugin: 'jacoco'

jacoco {
    toolVersion "0.8.11"
}

/**
 * Root task that generates the JaCoCo coverage report for the current Gradle subprojects.
 */
task jacocoFullReport(type: JacocoReport, group: 'Coverage reports') {
    group = 'Reporting'
    description = 'Generates an aggregate report from all subprojects'

    // Get list of projects which should be included in the report
    def projects = new ArrayList()
    subprojects.each { prj ->
        if (!ignoredByJacoco.contains(prj.name)) {
            projects.add(prj)
        }
    }

    //noinspection GrUnresolvedAccess
    dependsOn(projects.jacocoReport)

    final sourceDirs = files(projects.jacocoReport.sourceDirectories)

    additionalSourceDirs.setFrom sourceDirs
    sourceDirectories.setFrom sourceDirs

    classDirectories.setFrom files(projects.jacocoReport.classDirectories)
    executionData.setFrom files(projects.jacocoReport.executionData)

    reports {
        setReportEnabled(xml, true)
        html {
            setReportEnabled(it, true)
            setReportOutput(it, file('build/reports/jacoco/html'))
        }
        csv {
            setReportEnabled(it, true)
            setReportOutput(it, file('build/reports/jacoco/jacocoFullReport.csv'))
        }
    }

    doLast {
        printReport("jacocoFullReport")
    }
}

def printReport(task) {
    def report = file("$buildDir/reports/jacoco/${task}/${task}.xml")
    logger.lifecycle("Checking reports from ${report}")
    def skipCoverageVerification = project.hasProperty("skipCoverageVerification")

    def parser = new XmlParser()
    parser.setFeature("http://apache.org/xml/features/nonvalidating/load-external-dtd", false)
    parser.setFeature("http://apache.org/xml/features/disallow-doctype-decl", false)
    def results = parser.parse(report)

    def percentage = {
        if (it == null) {
            100
        } else {
            def covered = it.'@covered' as Double
            def missed = it.'@missed' as Double
            (covered / (covered + missed) * 100).round(2)
        }
    }

    def counters = results.counter
    def metrics = [:]
    metrics << [
            'instruction': percentage(counters.find { it.'@type'.equals('INSTRUCTION') }),
            'line'       : percentage(counters.find { it.'@type'.equals('LINE') }),
            'class'      : percentage(counters.find { it.'@type'.equals('CLASS') })
    ]

    def failures = []
    def passes = []

    // Fail the task if the coverage is below these numbers
    def minTestCoverage = [
            'instruction': 80,
            'line'       : 80,
            'class'      : 80
    ]

    metrics.each {
        def limit = minTestCoverage[it.key]
        if (it.value < limit) {
            failures.add("- ${it.key} coverage rate is ${it.value}%, the minimum is ${limit}")
        } else {
            passes.add("- ${it.key} coverage rate is ${it.value}%")
        }
    }

    if (failures) {
        logger.log(LogLevel.ERROR, "\n\n CODE COVERAGE FAILED!!!")
        failures.forEach {
            logger.quiet(it)
        }
        passes.each {
            logger.quiet(it)
        }
        if (!skipCoverageVerification) {
            throw new GradleException("Code coverage failed")
        }
    } else {
        logger.quiet("\n\n Code coverage passed!")
        passes.each {
            logger.quiet(it)
        }
    }

}
